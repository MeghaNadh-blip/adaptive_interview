{% extends "base.html" %}

{% block title %}{{ code }} — {{ title }}{% endblock %}

{% block content %}
<div style="max-width: 500px; margin: 40px auto; text-align: center;">
  <div class="card" style="padding: 36px 24px;">
    <div style="font-size: 48px; font-weight: 800; color: var(--color-accent); margin-bottom: 6px;">
      {{ code }}
    </div>
    <h1 style="font-size: 20px; font-weight: 700; color: var(--color-text-primary); margin-bottom: 8px;">
      {{ title }}
    </h1>
    <p style="font-size: 14px; color: var(--color-text-secondary); margin-bottom: 24px;">
      {{ message }}
    </p>
    <a href="{{ url_for('main.index') }}" class="btn btn-primary">
      Return to Home
    </a>
  </div>
</div>
{% endblock %}
