{% extends "base.html" %}

{% block title %}Sign Up — Adaptive Interview Intelligence{% endblock %}

{% block content %}
<div style="max-width: 460px; margin: 40px auto;">
  <div class="card">
    <div class="card-header">
      <h1 class="card-title">Create Account</h1>
      <p class="card-subtitle">Register to begin adaptive technical preparation</p>
    </div>

    <form method="POST" action="{{ url_for('auth.register') }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

      <div class="form-group">
        <label class="form-label" for="full_name">Full Name</label>
        <input type="text" id="full_name" name="full_name" class="form-control" placeholder="Jane Doe" required autofocus>
      </div>

      <div class="form-group">
        <label class="form-label" for="email">Email Address</label>
        <input type="email" id="email" name="email" class="form-control" placeholder="jane.doe@example.com" required>
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <input type="password" id="password" name="password" class="form-control" placeholder="At least 12 characters" required>
      </div>

      <div class="form-group">
        <label class="form-label" for="confirm_password">Confirm Password</label>
        <input type="password" id="confirm_password" name="confirm_password" class="form-control" placeholder="Repeat password" required>
      </div>

      <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 10px;">
        Register Account
      </button>
    </form>

    <div style="margin-top: 20px; padding-top: 16px; border-top: 1px solid var(--color-border); text-align: center; font-size: 13.5px;">
      <p style="color: var(--color-text-muted);">
        Already have an account? <a href="{{ url_for('auth.login') }}">Log in here</a>.
      </p>
    </div>
  </div>
</div>
{% endblock %}
